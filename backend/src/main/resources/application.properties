# Nome dell'applicazione
spring.application.name=travel-app

# Connessione al database Postgres
# Sostituisci 'nome_del_tuo_database' con il nome esatto usato su pgAdmin
spring.datasource.url=jdbc:postgresql://localhost:5432/travel_db
# Di default lo username e' 'postgres', cambialo se ne usi un altro
spring.datasource.username=postgres
# Inserisci la password che usi per accedere a pgAdmin
spring.datasource.password=1234

# Configurazione JPA/Hibernate (Gestione delle tabelle)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configurazione JWT (Chiave Base64 e Scadenza di 24 ore in millisecondi)
