services:
  # 1. Il database PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: horizon_postgres
    environment:
      POSTGRES_DB: travel_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db-init/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always

  # 2. Server SMTP e Webmail locale per testare il Recupero Password (http://localhost:8025)
  mailpit:
    image: axllent/mailpit:latest
    container_name: horizon_mailpit
    ports:
      - "1025:1025" # Porta SMTP interna
      - "8025:8025" # Interfaccia Webmail nel browser (http://localhost:8025)
    restart: always

  # 3. Il Backend Spring Boot
  backend:
    build: .
    container_name: horizon_backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/travel_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 1234
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      APP_UPLOAD_DIR: /app/uploads
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - db
      - mailpit
    restart: always

volumes:
  postgres_data: