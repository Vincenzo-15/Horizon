services:
  # 1. Il database PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: horizon_postgres
    environment:
      POSTGRES_DB: travel_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db-init/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always

  # 2. Il Backend Spring Boot
  backend:
    build: .
    container_name: horizon_backend
    ports:
      - "8080:8080"
    environment:
      # Sovrascrive dinamicamente url, utente e password dell'application.properties
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/travel_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 1234
    depends_on:
      - db
    restart: always

volumes:
  # Rende i dati del database persistenti anche se spegni i container
  postgres_data: